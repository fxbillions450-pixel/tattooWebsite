name: Import approved NOIR preview

on:
  push:
    branches: [main]
    paths:
      - '.noir-import/**'

permissions:
  contents: write

concurrency:
  group: noir-approved-import
  cancel-in-progress: false

jobs:
  import:
    if: github.repository == 'fxbillions450-pixel/tattooWebsite'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out approved import
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Set up exact mesh-generation Python version
        uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c
        with:
          python-version: '3.13.5'
      - name: Install pinned build dependencies
        run: python -m pip install --only-binary=:all: numpy==2.3.5 scipy==1.17.0 scikit-image==0.26.0
      - name: Restore source and verify approved website byte-for-byte
        env:
          PYTHONHASHSEED: '0'
        run: |
          python - <<'PY'
          import base64, gzip, hashlib, json, pathlib, subprocess, sys
          root = pathlib.Path.cwd()
          parts = [root / '.noir-import' / f'part-{i}.b64' for i in range(3)]
          encoded = ''.join(''.join(p.read_text(encoding='utf-8').split()) for p in parts)
          packed = base64.b64decode(encoded, validate=True)
          expected_payload = '9bcf916ba635a2d186d1cfde23d28ab3030cf519d9796df184a6f48b0a84e9a9'
          if hashlib.sha256(packed).hexdigest() != expected_payload:
              raise SystemExit('Import payload integrity check failed; nothing will be published.')
          source = json.loads(gzip.decompress(packed).decode('utf-8'))
          allowed = {
              'src/shell.html', 'src/styles.css', 'src/artwork.js',
              'src/engine.js', 'src/motion.js', 'src/app.js',
              'tools/build_mesh.py', 'tools/build.py', 'vercel.json', 'robots.txt'
          }
          if set(source) != allowed or not all(isinstance(v, str) for v in source.values()):
              raise SystemExit('Unexpected source entries; nothing will be published.')
          for name, content in source.items():
              path = root / name
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content, encoding='utf-8')
          (root / 'public').mkdir(exist_ok=True)
          subprocess.run([sys.executable, 'tools/build_mesh.py'], check=True)
          subprocess.run([sys.executable, 'tools/build.py'], check=True)
          expected_html = '0c3feb495cb9d7160e47c0e58b41d4cb02d46d22ee223abc6a45e8d50580be78'
          actual = hashlib.sha256((root / 'index.html').read_bytes()).hexdigest()
          if actual != expected_html:
              raise SystemExit(f'Approved HTML mismatch: {actual}; nothing will be published.')
          if (root / 'index.html').read_bytes() != (root / 'public/index.html').read_bytes():
              raise SystemExit('Public HTML mismatch; nothing will be published.')
          print('APPROVED HTML VERIFIED:', actual)
          print('Original 3D mesh, artwork, styles and fluid motion are preserved.')
          PY
      - name: Commit verified website to main
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config user.name 'fxbillions450-pixel'
          git config user.email '289425272+fxbillions450-pixel@users.noreply.github.com'
          git add -- src tools/build.py tools/build_mesh.py tools/mesh-info.json index.html public/index.html build-manifest.json vercel.json robots.txt
          git rm -- .noir-import/part-0.b64 .noir-import/part-1.b64 .noir-import/part-2.b64
          git commit -m 'Publish approved NOIR tattoo website with verified fluid motion'
          askpass="$RUNNER_TEMP/noir-git-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token" ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" git push origin HEAD:main
