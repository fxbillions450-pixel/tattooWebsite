name: Verify Wizards Tattoos branding
on:
  push:
    branches: [branding/wizards-tattoos]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Build checked-in branding and verify unchanged interaction sources
        run: |
          python3 tools/build.py
          git diff --exit-code 3c208aecd51ce87588c2b8faae311c23f706fcef -- src/styles.css src/app.js src/scroll.js src/motion.js src/engine.js src/artwork.js src/mesh.js
          node --test tests/*.test.cjs
          node tools/test_motion.cjs
      - name: Install browser runtime
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Verify logo and responsive branding with real WebGL
        env:
          REQUIRE_WEBGL: '1'
        run: python3 tests/branding.py
      - name: Verify existing continuous scroll and animation regressions
        run: python3 tests/browser_scroll.py
      - name: Save review images and generated HTML
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wizards-brand-review
          path: |
            assets/wizards-instagram-logo.jpg
            evidence/wizards
            index.html
            build-manifest.json
          retention-days: 3
