name: Verify deployed Wizards audit fixes
on:
  push:
    branches: [fix/wizards-audit-cleanup]
permissions:
  contents: read
jobs:
  verify_live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIZARDS_AUDIT_URL: https://tattoowebsite-xi.vercel.app/?v=8b7058b
      WIZARDS_REQUIRE_WEBGL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 8b7058b6bb3c63638fae9b13e304641a33558c51
          persist-credentials: false
      - name: Verify public HTML matches the exact approved build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from urllib.request import Request, urlopen
          from urllib.parse import urlparse
          import hashlib, json, os, time
          expected='ab117b1265f262bce66e9d086c52054c67d4faba30334435f5271c2bc223f7fc'
          for attempt in range(8):
              with urlopen(Request(os.environ['WIZARDS_AUDIT_URL'],headers={'Cache-Control':'no-cache','User-Agent':'Wizards-preview-regression-check'}),timeout=30) as response:
                  assert urlparse(response.url).hostname == 'tattoowebsite-xi.vercel.app'
                  content=response.read()
              actual=hashlib.sha256(content).hexdigest()
              if actual==expected: break
              time.sleep(5)
          assert actual==expected, actual
          assert content==Path('index.html').read_bytes()==Path('public/index.html').read_bytes()
          print('Verified production HTML:',len(content),'bytes, SHA256',actual)
          PY
      - name: Install isolated browser runtime
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Verify the four fixes against the actual live website
        run: |
          python3 tests/audit_cleanup.py \
            AuditCleanup.test_01_short_landscape_controls_and_panels \
            AuditCleanup.test_02_landscape_menu_reachable \
            AuditCleanup.test_04_browser_back_closes_each_gallery_and_restores_route_focus \
            AuditCleanup.test_05_normal_close_and_escape_restore_card_focus \
            AuditCleanup.test_06_hash_navigation_cannot_keep_stale_gallery \
            AuditCleanup.test_07_four_generated_footers_use_wizards_brand \
            AuditCleanup.test_09_spaces_only_fields_rejected_and_errors_clear \
            AuditCleanup.test_10_trimmed_minimum_and_unicode_input \
            AuditCleanup.test_11_valid_draft_survives_edit_resize_and_stays_text \
            AuditCleanup.test_12_native_email_and_empty_validation_preserved
      - name: Verify live continuous desktop wheel input and mobile touch
        run: |
          python3 - <<'PY'
          import os, sys, unittest
          sys.path.insert(0,'tests')
          from browser_scroll import ScrollFlow
          class LiveScrollFlow(ScrollFlow):
              @classmethod
              def setUpClass(cls):
                  super().setUpClass()
                  cls.url=os.environ['WIZARDS_AUDIT_URL']
          names=[
              'test_01_rapid_notches_pass_sections_before_landing',
              'test_02_immediate_reversal_during_motion',
              'test_03_gentle_continuation_is_registered',
              'test_06_artist_panel_top_scroll_returns_home',
              'test_07_native_reading_and_boundary_remain_usable',
              'test_09_touch_long_drag_and_reverse_before_landing',
          ]
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(LiveScrollFlow(name) for name in names))
          if not result.wasSuccessful():raise SystemExit(1)
          PY
      - name: Save live screenshots and wheel evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wizards-audit-cleanup-live
          retention-days: 7
          path: |
            evidence/audit-cleanup/
            evidence/scroll-flow-browser.json
