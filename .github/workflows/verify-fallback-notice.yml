name: Verify deployed Wizards fallback notice
on:
  push:
    branches: [fix/wizards-fallback-notice]
permissions:
  contents: read
jobs:
  verify_live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WIZARDS_AUDIT_URL: https://tattoowebsite-xi.vercel.app/?v=6685731
      WIZARDS_REQUIRE_WEBGL: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 668573190545dbf38aef5e5055b3fc0f7744853d
          persist-credentials: false
      - name: Verify live HTML equals the exact main build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, time, urllib.request
          expected=Path('public/index.html').read_bytes()
          assert hashlib.sha256(expected).hexdigest()=='4d10c187d051b8c6cc9392c132861e7ecabee17871ee0033e0392b8d5085d587'
          for attempt in range(6):
              with urllib.request.urlopen(os.environ['WIZARDS_AUDIT_URL'],timeout=30) as response:
                  actual=response.read()
              if actual==expected: break
              time.sleep(5)
          assert actual==expected, 'Public alias has not reached the verified build'
          print('Public HTML parity:',len(actual),hashlib.sha256(actual).hexdigest())
          PY
      - name: Install isolated browser checks
        run: |
          python3 -m pip install playwright==1.57.0 Pillow==11.3.0
          python3 -m playwright install --with-deps chromium
      - name: Test live fallback layouts, dismissal, form and context loss
        run: |
          python3 tests/fallback_notice.py FallbackNotice.test_02_notice_reserves_space_all_sections_and_sizes FallbackNotice.test_03_dismiss_preserves_content_route_and_reclaims_space FallbackNotice.test_04_keyboard_dismiss_restores_visible_focus FallbackNotice.test_05_menu_and_panel_scroll_with_notice_visible FallbackNotice.test_06_gallery_and_demo_form_remain_usable FallbackNotice.test_09_real_webgl_context_loss_enters_safe_fallback
      - name: Test live uninterrupted desktop wheel and mobile touch
        run: |
          python3 - <<'PY'
          import os, runpy, unittest
          cls=runpy.run_path('tests/browser_scroll.py')['ScrollFlow']
          original=cls.setUpClass.__func__
          def live_setup(c):
              original(c)
              c.url=os.environ['WIZARDS_AUDIT_URL']
          cls.setUpClass=classmethod(live_setup)
          names=['test_01_rapid_notches_pass_sections_before_landing','test_02_immediate_reversal_during_motion','test_09_touch_long_drag_and_reverse_before_landing']
          result=unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(cls(name) for name in names))
          assert result.wasSuccessful() and not result.skipped
          PY
      - name: Save live test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wizards-qa01-live
          retention-days: 7
          path: |
            evidence/fallback-notice/
            evidence/scroll-flow-browser.json
