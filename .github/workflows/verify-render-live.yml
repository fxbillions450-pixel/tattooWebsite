name: Verify deployed Wizards renderer
on:
  push:
    branches: [perf/wizards-skin-motion]
    paths: ['.github/workflows/verify-render-live.yml']
permissions:
  contents: read
jobs:
  public-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Confirm public build matches the reviewed bytes
        run: |
          python3 - <<'PY'
          import urllib.request,hashlib
          url='https://tattoowebsite-xi.vercel.app/?v=673fbfe'
          with urllib.request.urlopen(url,timeout=30) as r:
              assert r.status==200
              data=r.read()
          digest=hashlib.sha256(data).hexdigest()
          assert digest=='bc50391184718cb8adfd77aaf3c406ec917480802e29dbd1fc4f978fbb934f2e',digest
          assert b'class="motion-btn"' not in data and b'class="color-settings"' not in data
          print('Public website verified:',url,len(data),digest)
          PY
      - name: Install browser runtime
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Test public WebGL modes and actual wheel input
        run: |
          python3 - <<'PY'
          from playwright.sync_api import sync_playwright
          with sync_playwright() as p:
              b=p.chromium.launch(headless=True,args=['--no-sandbox','--use-gl=angle','--use-angle=swiftshader','--enable-unsafe-swiftshader'])
              page=b.new_page(viewport={'width':1760,'height':832},reduced_motion='no-preference')
              errors=[];page.on('pageerror',lambda e:errors.append(str(e)))
              page.goto('https://tattoowebsite-xi.vercel.app/?v=673fbfe#home')
              page.wait_for_function('window.__NOIR_TEST__?.assetsWarmed',timeout=45000)
              assert page.evaluate('window.__NOIR_TEST__.webgl')
              assert page.evaluate('window.__NOIR_TEST__.renderInfo.material')=='skin'
              assert page.locator('.motion-btn,.color-settings,[data-color]').count()==0
              page.mouse.move(850,420)
              for _ in range(3):page.mouse.wheel(0,120);page.wait_for_timeout(60)
              page.wait_for_function("window.__NOIR_TEST__.section==='ritual'")
              page.mouse.wheel(0,-120)
              page.wait_for_function("window.__NOIR_TEST__.section==='work'")
              page.goto('https://tattoowebsite-xi.vercel.app/?arm=original&v=673fbfe#home')
              page.wait_for_function('window.__NOIR_TEST__?.assetsWarmed',timeout=45000)
              assert page.evaluate('window.__NOIR_TEST__.webgl')
              assert page.evaluate('window.__NOIR_TEST__.renderInfo.material')=='original'
              assert not errors,errors
              print('PASS: live skin, removed controls, forward and reverse native wheel input, original-arm fallback; no JS errors')
              b.close()
          PY
