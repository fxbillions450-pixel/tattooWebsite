name: Verify Wizards desktop renderer and skin
on:
  push:
    branches: [perf/wizards-skin-motion]
    paths: ['tools/prepare-render-review.py', 'tests/render_release.py', '.github/workflows/verify-render-review.yml']
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Preserve the approved build and apply the reviewed changes
        run: |
          python3 tools/build.py
          cp index.html /tmp/wizards-baseline.html
          python3 tools/prepare-render-review.py
          python3 tools/build.py
          python3 - <<'PY'
          import hashlib,pathlib
          data=pathlib.Path('index.html').read_bytes()
          assert hashlib.sha256(data).hexdigest()=='bc50391184718cb8adfd77aaf3c406ec917480802e29dbd1fc4f978fbb934f2e'
          assert data==pathlib.Path('public/index.html').read_bytes()
          PY
          git diff --exit-code -- src/mesh.js src/motion.js src/scroll.js src/artwork.js src/brand.css
          node --check src/engine.js
          node --check src/app.js
          mkdir -p evidence
          node --test tests/scroll.test.cjs
          node tools/test_motion.cjs
      - name: Install the browser test runtime
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Check real WebGL skin and desktop rendering work
        env:
          WIZARDS_BASELINE_HTML: /tmp/wizards-baseline.html
        run: python3 tests/render_release.py
      - name: Verify existing wheel, touch, history and branding regressions
        run: |
          python3 tests/browser_scroll.py
          python3 tests/branding.py
      - name: Save original and new preview evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: wizards-render-review
          path: |
            evidence/render-release/
            index.html
            build-manifest.json
          retention-days: 7
      - name: Commit only verified files on the review branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config user.name 'fxbillions450-pixel'
          git config user.email '289425272+fxbillions450-pixel@users.noreply.github.com'
          git add -- src/engine.js src/app.js src/styles.css src/shell.html tests/browser_scroll.py index.html public/index.html build-manifest.json
          git commit -m 'Build verified skin material and lighter desktop rendering'
          askpass="$RUNNER_TEMP/wizards-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token" ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" git push origin HEAD:perf/wizards-skin-motion
