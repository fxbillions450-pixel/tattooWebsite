name: Verify public NOIR scroll deployment
on:
  push:
    branches: [fix/noir-scroll-flow]
permissions:
  contents: read
jobs:
  verify_public:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify exact public HTML bytes
        run: |
          python3 - <<'PY'
          import hashlib, urllib.request
          url = 'https://tattoowebsite-xi.vercel.app/?verify=3c208ae'
          request = urllib.request.Request(url, headers={'Cache-Control': 'no-cache'})
          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()
              print('HTTP', response.status, 'FINAL URL', response.url)
          digest = hashlib.sha256(data).hexdigest()
          print('PUBLIC HTML BYTES', len(data), 'SHA256', digest)
          assert digest == '312c252514fde6c1c2fa933453fd41974d0527e9b302ac3f441dd0eca95cf14c', 'Public alias is not serving the reviewed build'
          PY
      - name: Install isolated browser checks
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Test actual public mouse-wheel navigation with WebGL
        run: |
          python3 - <<'PY'
          import sys, unittest
          sys.path.insert(0, 'tests')
          import browser_scroll as checks
          original = checks.ScrollFlow.setUpClass.__func__
          def public_setup(cls):
              original(cls)
              cls.url = 'https://tattoowebsite-xi.vercel.app/?verify=3c208ae'
          checks.ScrollFlow.setUpClass = classmethod(public_setup)
          names = [
              'test_01_rapid_notches_pass_sections_before_landing',
              'test_02_immediate_reversal_during_motion',
              'test_03_gentle_continuation_is_registered',
              'test_05_file_and_http_have_same_input_results',
              'test_06_artist_panel_top_scroll_returns_home',
              'test_07_native_reading_and_boundary_remain_usable'
          ]
          result = unittest.TextTestRunner(verbosity=2).run(unittest.TestSuite(checks.ScrollFlow(name) for name in names))
          raise SystemExit(0 if result.wasSuccessful() else 1)
          PY
