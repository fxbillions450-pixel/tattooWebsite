name: Verify continuous NOIR scrolling
on:
  push:
    branches: [fix/noir-scroll-flow]
permissions:
  contents: write
concurrency:
  group: noir-scroll-flow
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'fxbillions450-pixel/tattooWebsite'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Build the reviewed source and verify identical output
        run: |
          set -euo pipefail
          python3 tools/build.py
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          html = Path('index.html').read_bytes()
          assert hashlib.sha256(html).hexdigest() == '312c252514fde6c1c2fa933453fd41974d0527e9b302ac3f441dd0eca95cf14c'
          assert html == Path('public/index.html').read_bytes()
          print('Reviewed HTML verified:', hashlib.sha256(html).hexdigest())
          PY
          node --check src/scroll.js
          node --test tests/*.test.cjs
          node tools/test_motion.cjs
      - name: Install browser test runtime
        run: |
          python3 -m pip install playwright==1.57.0
          python3 -m playwright install --with-deps chromium
      - name: Exercise real WebGL camera and continuous input over HTTP and local file
        run: python3 tests/browser_scroll.py
      - name: Commit only verified generated previews to the isolated branch
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TERMINAL_PROMPT: '0'
        run: |
          set -euo pipefail
          git config user.name 'fxbillions450-pixel'
          git config user.email '289425272+fxbillions450-pixel@users.noreply.github.com'
          git add -- index.html public/index.html build-manifest.json
          git commit -m 'Build verified continuous-scroll client preview'
          askpass="$RUNNER_TEMP/noir-flow-askpass.sh"
          printf '%s\n' '#!/bin/sh' 'case "$1" in *Username*) printf "%s\n" "x-access-token" ;; *) printf "%s\n" "$GH_TOKEN" ;; esac' > "$askpass"
          chmod 700 "$askpass"
          trap 'rm -f "$askpass"' EXIT
          GIT_ASKPASS="$askpass" git push origin HEAD:fix/noir-scroll-flow
